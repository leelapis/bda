<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Step 1: Compute Proximity Matrix -->
  <rect x="100" y="20" width="200" height="60" rx="5" ry="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1" font-weight="bold">Compute Proximity</text>
  <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1" font-weight="bold">Matrix</text>

  <!-- Arrow Step 1 to Step 2 -->
  <line x1="200" y1="80" x2="200" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Merge Closest Clusters -->
  <rect x="100" y="120" width="200" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Merge the closest</text>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">two clusters</text>

  <!-- Arrow Step 2 to Step 3 -->
  <line x1="200" y1="180" x2="200" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Update Proximity Matrix -->
  <rect x="100" y="220" width="200" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Update Proximity</text>
  <text x="200" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Matrix</text>

  <!-- Arrow Step 3 to Decision -->
  <line x1="200" y1="280" x2="200" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision: Only One Cluster Left? -->
  <polygon points="200,330 330,390 200,450 70,390" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e65100" font-weight="bold">Only one</text>
  <text x="200" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e65100" font-weight="bold">cluster remains?</text>

  <!-- Arrow Decision to End (Yes) -->
  <line x1="200" y1="450" x2="200" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="485" font-family="Arial, sans-serif" font-size="12" fill="#333">Yes</text>

  <!-- End Node -->
  <rect x="150" y="510" width="100" height="50" rx="25" ry="25" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="200" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#880e4f" font-weight="bold">End</text>

  <!-- Back Loop (No) -->
  <path d="M 70 390 L 40 390 L 40 150 L 100 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="45" y="380" font-family="Arial, sans-serif" font-size="12" fill="#333">No</text>
</svg>
