<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Define arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Start Node -->
  <rect x="150" y="20" width="100" height="50" rx="25" ry="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1" font-weight="bold">Start</text>

  <!-- Arrow Start to Select -->
  <line x1="200" y1="70" x2="200" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Select Centroids -->
  <rect x="110" y="100" width="180" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Select K initial</text>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">centroids</text>

  <!-- Arrow Select to Assign -->
  <line x1="200" y1="160" x2="200" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Assign Points -->
  <rect x="90" y="190" width="220" height="60" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Assign points to</text>
  <text x="200" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">nearest centroids</text>

  <!-- Arrow Assign to Update -->
  <line x1="200" y1="250" x2="200" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Update Centroids -->
  <rect x="110" y="280" width="180" height="50" rx="5" ry="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">Update centroids</text>

  <!-- Arrow Update to Converged -->
  <line x1="200" y1="330" x2="200" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Converged Decision -->
  <polygon points="200,360 320,410 200,460 80,410" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="200" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e65100" font-weight="bold">Has converged?</text>

  <!-- Arrow Converged to End (Yes) -->
  <line x1="200" y1="460" x2="200" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="485" font-family="Arial, sans-serif" font-size="12" fill="#333">Yes</text>

  <!-- End Node -->
  <rect x="150" y="500" width="100" height="50" rx="25" ry="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="200" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1" font-weight="bold">End</text>

  <!-- Back Loop (No) -->
  <path d="M 80 410 L 40 410 L 40 220 L 90 220" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="45" y="400" font-family="Arial, sans-serif" font-size="12" fill="#333">No</text>
</svg>
